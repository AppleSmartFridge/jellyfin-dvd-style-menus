name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  FFMPEG_VERSION: 7.1.1
  LIBBLURAY_VERSION: 1.3.4

jobs:
  # ------------------------------------------------------------------ native runtime bundles
  runtime-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-24.04
            image: debian:bookworm
            java: /usr/lib/jvm/java-17-openjdk-amd64
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            image: debian:bookworm
            java: /usr/lib/jvm/java-17-openjdk-arm64
          - rid: linux-musl-x64
            runner: ubuntu-24.04
            image: alpine:3.20
            java: /usr/lib/jvm/java-17-openjdk
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    env:
      JAVA_HOME: ${{ matrix.java }}
    steps:
      - name: Install build tools (Debian)
        if: startsWith(matrix.image, 'debian')
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake pkg-config nasm curl ca-certificates git \
            patchelf zip xz-utils bzip2 libx264-dev libfreetype-dev libfontconfig-dev ant openjdk-17-jdk-headless
      - name: Install build tools (Alpine)
        if: startsWith(matrix.image, 'alpine')
        run: |
          apk add --no-cache bash build-base cmake pkgconf nasm curl git patchelf zip xz bzip2 linux-headers \
            x264-dev freetype-dev fontconfig-dev apache-ant openjdk17-jdk
      - uses: actions/checkout@v5
      - name: Build FFmpeg, libbluray and bdmenu
        shell: bash
        run: PREFIX=$PWD/build/prefix ./native/scripts/ci-run.sh build ./native/scripts/build-deps.sh
      - name: Smoke test
        shell: bash
        run: ./build/prefix/bin/bdmenu 2>&1 | grep -q usage
      - name: Bundle
        shell: bash
        run: PREFIX=$PWD/build/prefix RID=${{ matrix.rid }} OUT=$PWD/dist ./native/scripts/ci-run.sh bundle ./native/scripts/bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.rid }}
          path: dist/bdmenu-runtime-${{ matrix.rid }}.zip*

  runtime-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install build tools
        run: brew install cmake pkg-config nasm x264 freetype fontconfig ant dylibbundler
      - name: Build FFmpeg, libbluray and bdmenu
        run: PREFIX=$PWD/build/prefix ./native/scripts/ci-run.sh build ./native/scripts/build-deps.sh
      - name: Bundle
        run: PREFIX=$PWD/build/prefix RID=${{ matrix.rid }} OUT=$PWD/dist ./native/scripts/ci-run.sh bundle ./native/scripts/bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.rid }}
          path: dist/bdmenu-runtime-${{ matrix.rid }}.zip*

  runtime-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          install: >-
            git make zip unzip curl bzip2 xz
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-nasm mingw-w64-ucrt-x86_64-x264 mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-fontconfig
      - name: Get Apache Ant
        run: |
          curl -fsSL -o ant.zip https://archive.apache.org/dist/ant/binaries/apache-ant-1.10.15-bin.zip
          unzip -q ant.zip -d /opt
      - name: Build FFmpeg, libbluray and bdmenu
        run: |
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          export PATH="/opt/apache-ant-1.10.15/bin:$PATH"
          PREFIX=$PWD/build/prefix ./native/scripts/ci-run.sh build ./native/scripts/build-deps.sh
      - name: Bundle
        run: |
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          PREFIX=$PWD/build/prefix RID=win-x64 OUT=$PWD/dist ./native/scripts/ci-run.sh bundle ./native/scripts/bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-win-x64
          path: dist/bdmenu-runtime-win-x64.zip*

  # ------------------------------------------------------------------ plugin
  plugin:
    needs: [runtime-linux, runtime-macos, runtime-windows]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          pattern: runtime-*
          path: dist
          merge-multiple: true
      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0.${GITHUB_RUN_NUMBER}"; fi
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && v="$v.0"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Write runtime manifest (download address + checksums)
        run: |
          python3 packaging/runtime_manifest.py \
            --dist dist \
            --version "${{ steps.v.outputs.version }}" \
            --base-url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/" \
            --out src/Jellyfin.Plugin.DiscMenus/Native/runtime-manifest.json
          cat src/Jellyfin.Plugin.DiscMenus/Native/runtime-manifest.json
      - name: Test
        run: dotnet test tests/Jellyfin.Plugin.DiscMenus.Tests -c Release
      - name: Build plugin
        run: |
          dotnet publish src/Jellyfin.Plugin.DiscMenus -c Release -o out/plugin \
            -p:Version=${{ steps.v.outputs.version }} -p:AssemblyVersion=${{ steps.v.outputs.version }} -p:FileVersion=${{ steps.v.outputs.version }}
      - name: Package
        run: |
          python3 packaging/package.py \
            --plugin-dir out/plugin \
            --dist dist \
            --version "${{ steps.v.outputs.version }}" \
            --owner "${{ github.repository_owner }}" \
            --repo-url "https://github.com/${{ github.repository }}" \
            --tag "${{ github.ref_name }}" \
            --out release
          ls -la release
      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: release/*
      - name: Pick release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Uses docs/release-notes/<tag>.md when it exists; otherwise GitHub generates notes.
          f="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$f" ]; then echo "path=$f" >> "$GITHUB_OUTPUT"; echo "generate=false" >> "$GITHUB_OUTPUT"
          else echo "path=" >> "$GITHUB_OUTPUT"; echo "generate=true" >> "$GITHUB_OUTPUT"; fi
      - name: Release
        # Only publish when every runtime bundle built, so a release is never missing platforms.
        if: >-
          startsWith(github.ref, 'refs/tags/v') &&
          needs.runtime-linux.result == 'success' &&
          needs.runtime-macos.result == 'success' &&
          needs.runtime-windows.result == 'success'
        uses: softprops/action-gh-release@v2
        with:
          name: Disc Menus ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.generate == 'true' }}
          files: |
            release/*
            dist/bdmenu-runtime-*.zip
