<div id="DiscRemotePage" data-role="page" class="page type-interior pluginConfigurationPage" data-title="Disc Remote">
    <div data-role="content">
        <div class="content-primary">
            <div id="dmRemoteHost"></div>
        </div>
    </div>
    <script type="text/javascript">
        (function () {
            'use strict';
            var page = document.getElementById('DiscRemotePage');
            var handle = null;

            function load(src, isCss) {
                return new Promise(function (resolve, reject) {
                    var url = ApiClient.getUrl(src);
                    if (document.querySelector((isCss ? 'link[href="' : 'script[src="') + url + '"]')) { resolve(); return; }
                    var tag = document.createElement(isCss ? 'link' : 'script');
                    if (isCss) { tag.rel = 'stylesheet'; tag.href = url; } else { tag.src = url; }
                    tag.onload = resolve;
                    tag.onerror = reject;
                    document.head.appendChild(tag);
                });
            }

            page.addEventListener('viewshow', function () {
                Promise.all([load('DiscMenus/Remote/remote.css', true), load('DiscMenus/Remote/remote.js', false)]).then(function () {
                    if (handle) { handle.destroy(); }
                    handle = window.DiscRemote.mount(page.querySelector('#dmRemoteHost'), window.DiscRemote.jellyfinTransport(ApiClient), { captureKeys: true });
                });
            });

            page.addEventListener('viewhide', function () {
                if (handle) { handle.destroy(); handle = null; }
            });
        })();
    </script>
</div>
